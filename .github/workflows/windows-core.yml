name: Windows Core CI

on:
  push:
    branches:
      - main
    paths:
      - "Shared/PHTVCore/**"
      - "Shared/Contracts/**"
      - ".github/workflows/windows-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Shared/PHTVCore/**"
      - "Shared/Contracts/**"
      - ".github/workflows/windows-core.yml"
  workflow_dispatch:

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core:
    name: Swift Core & C ABI (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          winget install `
            --id Swift.Toolchain `
            --exact `
            --version 6.3.3 `
            --source winget `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          $searchRoots = @(
            "$env:LOCALAPPDATA\Programs\Swift",
            "$env:ProgramFiles\Swift"
          ) | Where-Object { Test-Path $_ }

          $swift = Get-ChildItem `
            -Path $searchRoots `
            -Filter swift.exe `
            -File `
            -Recurse |
            Where-Object { $_.FullName -match '\\usr\\bin\\swift\.exe$' } |
            Select-Object -First 1

          if (-not $swift) {
            throw "Swift was installed, but swift.exe could not be located."
          }

          $swift.Directory.FullName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $swift.FullName --version

      - name: Build portable Core
        run: swift build --package-path Shared/PHTVCore

      - name: Run Core contract tests
        run: swift test --package-path Shared/PHTVCore

      - name: Verify exported C ABI
        run: swift run --package-path Shared/PHTVCore PHTVCoreABISmoke
