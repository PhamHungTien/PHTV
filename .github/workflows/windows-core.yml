name: Windows CI

on:
  push:
    branches:
      - main
    paths:
      - "Apps/Windows/**"
      - "Shared/PHTVCore/**"
      - "Shared/Contracts/**"
      - "Shared/TestVectors/**"
      - ".github/workflows/windows-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Apps/Windows/**"
      - "Shared/PHTVCore/**"
      - "Shared/Contracts/**"
      - "Shared/TestVectors/**"
      - ".github/workflows/windows-core.yml"
  workflow_dispatch:

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core:
    name: Core, TSF & WinUI (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          winget install `
            --id Swift.Toolchain `
            --exact `
            --version 6.3.3 `
            --source winget `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity

          $searchRoots = @(
            "$env:LOCALAPPDATA\Programs\Swift",
            "$env:ProgramFiles\Swift"
          ) | Where-Object { Test-Path $_ }

          $swift = Get-ChildItem `
            -Path $searchRoots `
            -Filter swift.exe `
            -File `
            -Recurse |
            Where-Object { $_.FullName -match '\\usr\\bin\\swift\.exe$' } |
            Select-Object -First 1

          if (-not $swift) {
            throw "Swift was installed, but swift.exe could not be located."
          }

          $swift.Directory.FullName |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $swift.FullName --version

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Apps/Windows/global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build and run runtime settings snapshot tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "Apps/Windows/tests/PHTV.Windows.SettingsSnapshot.Tests/PHTV.Windows.SettingsSnapshot.Tests.vcxproj"
          msbuild `
            $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.SettingsSnapshot.Tests" `
            -Filter "PHTV.Windows.SettingsSnapshot.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Runtime settings snapshot test executable was not produced."
          }

          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime settings snapshot tests failed with exit code $LASTEXITCODE."
          }

      - name: Build portable Core
        run: swift build --package-path Shared/PHTVCore

      - name: Run Core contract tests
        run: swift test --package-path Shared/PHTVCore

      - name: Verify exported C ABI
        run: swift run --package-path Shared/PHTVCore PHTVCoreABISmoke

      - name: Locate portable Core artifacts
        id: core-artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $library = Get-ChildItem `
            -Path "Shared/PHTVCore/.build" `
            -Filter "PHTVCore.lib" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $library) {
            throw "PHTVCore.lib was not produced by SwiftPM."
          }

          $dll = Join-Path $library.Directory.FullName "PHTVCore.dll"
          if (-not (Test-Path $dll)) {
            throw "PHTVCore.dll was not produced beside the import library."
          }

          "library-dir=$($library.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and run native Core bridge tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $coreDirectory = "${{ steps.core-artifacts.outputs.library-dir }}"
          msbuild `
            "Apps/Windows/tests/PHTV.Windows.CoreBridge.Tests/PHTV.Windows.CoreBridge.Tests.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PHTVCoreLibraryDir="$coreDirectory"

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.CoreBridge.Tests" `
            -Filter "PHTV.Windows.CoreBridge.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Native Core bridge test executable was not produced."
          }

          $env:PATH = "$coreDirectory;$env:PATH"
          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Native Core bridge tests failed with exit code $LASTEXITCODE."
          }

      - name: Build TSF Text Input Processor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild `
            "Apps/Windows/src/PHTV.Windows.IME/PHTV.Windows.IME.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PHTVCoreLibraryDir="${{ steps.core-artifacts.outputs.library-dir }}"

      - name: Run configuration contract tests
        run: >
          dotnet run
          --project Apps/Windows/tests/PHTV.Windows.Contracts.Tests/PHTV.Windows.Contracts.Tests.csproj
          --configuration Release

      - name: Build WinUI Settings app
        run: >
          dotnet build
          Apps/Windows/src/PHTV.Windows.App/PHTV.Windows.App.csproj
          --configuration Release
          --runtime win-x64
          /p:Platform=x64
