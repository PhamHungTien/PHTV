name: Windows CI

on:
  push:
    branches:
      - main
    paths:
      - "Apps/Windows/**"
      - "Shared/PHTVCore/**"
      - "Shared/Contracts/**"
      - "Shared/TestVectors/**"
      - ".github/workflows/windows-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Apps/Windows/**"
      - "Shared/PHTVCore/**"
      - "Shared/Contracts/**"
      - "Shared/TestVectors/**"
      - ".github/workflows/windows-core.yml"
  workflow_dispatch:

concurrency:
  group: windows-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  core:
    name: Core, TSF & WinUI (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SWIFT_INSTALLER_URL: https://download.swift.org/swift-6.3.3-release/windows10/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10.exe
      SWIFT_INSTALLER_SHA256: 235626548F249CD516D3D4D90EEE980DCCAD46F3822DAC1F8E3119B0FEDE94B7

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Swift 6.3.3 installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}\swift-6.3.3-windows10.exe
          key: swift-6.3.3-windows-x64-235626548f249cd5

      - name: Setup Python 3.10 for Swift
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"

      - name: Download and verify Swift 6.3.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "swift-6.3.3-windows10.exe"

          if (-not (Test-Path $installer)) {
            & curl.exe `
              --fail `
              --location `
              --retry 5 `
              --retry-all-errors `
              --show-error `
              --output $installer `
              $env:SWIFT_INSTALLER_URL
            if ($LASTEXITCODE -ne 0) {
              throw "Swift download failed with exit code $LASTEXITCODE."
            }
          }

          $actualHash = (Get-FileHash `
            -Path $installer `
            -Algorithm SHA256).Hash
          if ($actualHash -ne $env:SWIFT_INSTALLER_SHA256) {
            Remove-Item -Force $installer
            throw "Swift installer SHA-256 mismatch."
          }

      - name: Install Swift 6.3.3
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "swift-6.3.3-windows10.exe"
          $installLog = Join-Path `
            $env:RUNNER_TEMP `
            "swift-6.3.3-install.log"
          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList @(
              "/quiet",
              "/norestart",
              "/log",
              $installLog
            ) `
            -Wait `
            -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Swift installer failed with exit code $($process.ExitCode)."
          }

          $searchRoots = @(
            "$env:LOCALAPPDATA\Programs\Swift",
            "$env:ProgramFiles\Swift",
            "C:\Library\Developer\Toolchains"
          ) | Where-Object { Test-Path $_ }

          $swift = Get-ChildItem `
            -Path $searchRoots `
            -Filter swift.exe `
            -File `
            -Recurse |
            Where-Object { $_.FullName -match '\\usr\\bin\\swift\.exe$' } |
            Select-Object -First 1

          if (-not $swift) {
            throw "Swift was installed, but swift.exe could not be located."
          }

          $swiftBin = $swift.Directory.FullName
          $installedUserPath = [Environment]::GetEnvironmentVariable(
            "Path",
            [EnvironmentVariableTarget]::User
          )
          $installedPathEntries = @(
            $swiftBin
            $installedUserPath -split ";" |
              Where-Object {
                (-not [string]::IsNullOrWhiteSpace($_)) -and (Test-Path $_)
              }
          ) | Select-Object -Unique
          $env:Path = "$($installedPathEntries -join ';');$env:Path"
          $installedPathEntries |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $swiftSdk = Get-ChildItem `
            -Path "$env:LOCALAPPDATA\Programs\Swift\Platforms" `
            -Directory `
            -Filter "Windows.sdk" `
            -Recurse |
            Select-Object -First 1
          if (-not $swiftSdk) {
            throw "Swift was installed, but Windows.sdk could not be located."
          }
          $env:SDKROOT = $swiftSdk.FullName
          "SDKROOT=$($swiftSdk.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $swift.FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw "swift --version failed with exit code $LASTEXITCODE."
          }

      - name: Upload Swift installer log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-installer-log
          path: ${{ runner.temp }}\swift-6.3.3-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Apps/Windows/global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Build and run input mode state tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "Apps/Windows/tests/PHTV.Windows.InputModeState.Tests/PHTV.Windows.InputModeState.Tests.vcxproj"
          msbuild `
            $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.InputModeState.Tests" `
            -Filter "PHTV.Windows.InputModeState.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Input mode state test executable was not produced."
          }

          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Input mode state tests failed with exit code $LASTEXITCODE."
          }

      - name: Build and run sensitive input scope policy tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "Apps/Windows/tests/PHTV.Windows.InputScopePolicy.Tests/PHTV.Windows.InputScopePolicy.Tests.vcxproj"
          msbuild `
            $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.InputScopePolicy.Tests" `
            -Filter "PHTV.Windows.InputScopePolicy.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Input scope policy test executable was not produced."
          }

          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Input scope policy tests failed with exit code $LASTEXITCODE."
          }

      - name: Build and run runtime settings snapshot tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "Apps/Windows/tests/PHTV.Windows.SettingsSnapshot.Tests/PHTV.Windows.SettingsSnapshot.Tests.vcxproj"
          msbuild `
            $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.SettingsSnapshot.Tests" `
            -Filter "PHTV.Windows.SettingsSnapshot.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Runtime settings snapshot test executable was not produced."
          }

          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Runtime settings snapshot tests failed with exit code $LASTEXITCODE."
          }

      - name: Build and run application rules snapshot tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = "Apps/Windows/tests/PHTV.Windows.ApplicationRulesSnapshot.Tests/PHTV.Windows.ApplicationRulesSnapshot.Tests.vcxproj"
          msbuild `
            $project `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.ApplicationRulesSnapshot.Tests" `
            -Filter "PHTV.Windows.ApplicationRulesSnapshot.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Application rules snapshot test executable was not produced."
          }

          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Application rules snapshot tests failed with exit code $LASTEXITCODE."
          }

      - name: Build portable Core
        run: swift build --package-path Shared/PHTVCore

      - name: Run Core contract tests
        run: swift test --package-path Shared/PHTVCore

      - name: Verify exported C ABI
        run: swift run --package-path Shared/PHTVCore PHTVCoreABISmoke

      - name: Locate portable Core artifacts
        id: core-artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $library = Get-ChildItem `
            -Path "Shared/PHTVCore/.build" `
            -Filter "PHTVCore.lib" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $library) {
            throw "PHTVCore.lib was not produced by SwiftPM."
          }

          $dll = Join-Path $library.Directory.FullName "PHTVCore.dll"
          if (-not (Test-Path $dll)) {
            throw "PHTVCore.dll was not produced beside the import library."
          }

          "library-dir=$($library.Directory.FullName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build and run native Core bridge tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $coreDirectory = "${{ steps.core-artifacts.outputs.library-dir }}"
          msbuild `
            "Apps/Windows/tests/PHTV.Windows.CoreBridge.Tests/PHTV.Windows.CoreBridge.Tests.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PHTVCoreLibraryDir="$coreDirectory"

          $testExecutable = Get-ChildItem `
            -Path "Apps/Windows/tests/PHTV.Windows.CoreBridge.Tests" `
            -Filter "PHTV.Windows.CoreBridge.Tests.exe" `
            -File `
            -Recurse |
            Select-Object -First 1
          if (-not $testExecutable) {
            throw "Native Core bridge test executable was not produced."
          }

          $env:PATH = "$coreDirectory;$env:PATH"
          & $testExecutable.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Native Core bridge tests failed with exit code $LASTEXITCODE."
          }

      - name: Build TSF Text Input Processor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          msbuild `
            "Apps/Windows/src/PHTV.Windows.IME/PHTV.Windows.IME.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:PHTVCoreLibraryDir="${{ steps.core-artifacts.outputs.library-dir }}"

      - name: Run configuration contract tests
        run: >
          dotnet run
          --project Apps/Windows/tests/PHTV.Windows.Contracts.Tests/PHTV.Windows.Contracts.Tests.csproj
          --configuration Release

      - name: Build WinUI Settings app
        run: >
          dotnet build
          Apps/Windows/src/PHTV.Windows.App/PHTV.Windows.App.csproj
          --configuration Release
          --runtime win-x64
          /p:Platform=x64
